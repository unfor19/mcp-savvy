# yaml-language-server: $schema=../schemas/checks-schema.json

# fon configuration for mcp-savvy.
# See `.fon/schemas/checks-schema.json` for all available keys.

# Skip auto-generated artifacts that fon shouldn't audit.
exclude_dirs:
  - coverage
  - dist-lambdas

# pnpm-lock.yaml is auto-generated by pnpm and follows its own format.
# We don't author it, so it doesn't get a JSON schema reference.
well_known_yaml_basenames:
  - pnpm-lock.yaml

# Interface methods (TokenStore/KeychainBackend/Runner) and shared test
# helpers will appear in many files by design — that's how interfaces work.
# Skip those names rather than collapse single-responsibility classes
# into one shared module.
check_exceptions:
  duplicate_symbols:
    paths:
      # `examples/chatgpt-app-mcp/server/audit.mjs` exports its own
      # `newCorrelationId` (full UUID for audit-log correlation) that
      # pre-dates the lock coordinator's `newCorrelationId` (8-char
      # slice for lock-acquisition correlation in
      # `packages/storage/src/lock/correlationId.ts`). Different
      # domains, intentionally distinct semantics — excluding the
      # example file is narrower than collapsing both into a shared
      # helper that neither package would naturally depend on.
      - examples/chatgpt-app-mcp/server/audit.mjs
    skip_symbols: # TokenStore + KeychainBackend interface methods
      - get
      - set
      - clear
      - delete
      - isAvailable
      # Runner + Fetcher + Transport interface methods
      - run
      - runWithStdin
      - fetch
      - send
      # CallbackServer interface methods (and matching test fakes)
      - listen
      - stop
      - awaitCallback
      # CommandDeps factories: real prod code + matching test fakes
      - createCallbackServer
      - createBridge
      # Repeated test helpers
      - recordingRunner
      - setRunImpl
      # JS reserved keywords/control flow flagged by fon's symbol parser
      # (false positives — these are language constructs, not symbols)
      - switch
      # AWS Lambda entry-point convention — every Lambda module exports
      # `handler` as its entry; expected to repeat across Lambda files.
      - handler
      # Each example's Lambda target is a self-contained bundle; the
      # AgentCore Gateway target-prefix stripper repeats across them
      # by design (can't share a util across separate Lambda zips).
      - stripPrefix
      # CDK's lambda.Code.fromAsset bundling.local API contract
      # mandates a callback called `tryBundle`. Every stack that
      # bundles its own Lambda asset implements one — the name is
      # fixed by the framework, not duplicated logic.
      - tryBundle
      # `jsonResponse` is the canonical proxy-integration response
      # shape helper. It's small (~10 lines) and intentionally
      # repeated across separately bundled Lambda assets — sharing
      # would force a workspace dep at runtime, defeating the
      # zero-dep bundle.
      - jsonResponse
      # Per-module DI hooks: each DynamoDB-touching module
      # (`audit.mjs`, `dynamo.mjs`, `secureRefs.mjs`) exports its
      # own `setClient(stub)` so unit tests can inject a mock
      # client without sharing global state.
      - setClient
      # `setTimeout` is a JS built-in; fon's symbol parser flags
      # call sites as if they were function declarations.
      - setTimeout
