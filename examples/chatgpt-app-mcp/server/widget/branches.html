<!doctype html>
<html lang="en">

<head>

                </span>
                <span class="title" id="title">Savvy branches</span>
            </span>
            <span class="badge"><span class="dot" aria-hidden="true"></span><span id="badgeText">…</span></span>
        </div>
        <ul id="list" class="list" aria-label="Branch list">
            <li class="row skeleton-row"><span class="skeleton"></span></li>
            <li class="row skeleton-row"><span class="skeleton"></span></li>
            <li class="row skeleton-row"><span class="skeleton"></span></li>
        </ul>
        <div id="footer" class="footer">
            <span id="footerText"></span>
        </div>
    </section>
