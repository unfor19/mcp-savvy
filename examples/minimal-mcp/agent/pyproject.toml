[project]
name = "mcp-savvy-demo-agent"
version = "0.0.0"
description = "Minimal MCP echo agent for the mcp-savvy demo."
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agent.py"]
